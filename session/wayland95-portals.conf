# xdg-desktop-portal backends for the Wayland 95 session
# (XDG_CURRENT_DESKTOP=Wayland95): file dialogs are Wayland 95's own
# (win95portal); the rest (settings, opening links...) comes from the KDE
# portal (or the GTK one where KDE isn't installed); secrets from the keyring.
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.FileChooser=wayland95
org.freedesktop.impl.portal.Secret=gnome-keyring;kwallet
