# The live ISO's boot menu (UEFI and BIOS) in Wayland 95's look: the theme
# from the wayland95 package, which live/build.sh copies next to this as
# /boot/grub/wayland95. (Replaces live-build's theme.cfg; config.cfg has
# set the screen to 800x600 before this.)
set color_normal=light-gray/black
set color_highlight=white/dark-gray
if [ -e /boot/grub/wayland95/theme.txt ]; then
    for f in sans-12 sans-bold-12 sans-26 sans-bold-26 mono-14; do
        loadfont /boot/grub/wayland95/$f.pf2
    done
    insmod gfxmenu
    set theme=/boot/grub/wayland95/theme.txt
    export theme
else
    set menu_color_normal=cyan/blue
    set menu_color_highlight=white/blue
fi
