<!doctype html><html><head><style>
body{margin:0;font:16px sans-serif}
a{display:block;width:400px;height:120px;background:#9cf;margin:20px}
select{margin:20px;font-size:20px}
</style></head><body>
<a id="link1" href="#one">LINK ONE</a>
<a id="link2" href="#two" title="tooltip on link two">LINK TWO</a>
<select id="sel"><option>one</option><option>two</option><option>three</option></select>
<a id="link3" href="#three">LINK THREE</a>
<div style="height:2000px"></div>
<script>
for (const t of ['mousedown','mouseup','click','dragstart','dragend','contextmenu'])
  document.addEventListener(t, e => console.log('EVT', t, e.clientX, e.clientY, e.target.id || e.target.tagName, 'buttons=' + e.buttons));
document.addEventListener('keydown', e => console.log('EVT key', e.key));
document.getElementById('sel').addEventListener('change', e => console.log('EVT selected', e.target.value));
for (const id of ["link1","link2","sel","link3"]) { const r = document.getElementById(id).getBoundingClientRect(); console.log("EVT rect", id, Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom)); }
document.addEventListener('wheel', e => console.log('EVT wheel', e.deltaY, e.deltaMode)); let st; window.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => console.log('EVT scrolled', Math.round(window.scrollY)), 150); });
window.addEventListener('hashchange', () => console.log('EVT navigated', location.hash));
</script></body></html>
