<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts in the Wayland 95 session: programs' "sans-serif" and "system-ui"
     (web pages, programs that don't name a font) are the desktop's own,
     Liberation Sans, as Arial was Windows'. The session points
     FONTCONFIG_FILE here (wayland95-session); other desktops keep theirs.
     These come before the system's settings: the first preference wins. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
