# The boot menu in Wayland 95's look: its GRUB theme (in the wayland95
# package; grub/wayland95 in the repository). update-grub reads this; the
# installer runs it, and so does the package when it's updated.
GRUB_THEME=/usr/share/grub/themes/wayland95/theme.txt
GRUB_GFXMODE=1024x768,auto
# no Debian wallpaper behind the command line (05_debian_theme)
GRUB_BACKGROUND=
